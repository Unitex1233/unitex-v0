version: "3.9"

# ────────────────────────────────────────────────────────────────────────────────
# UniteX Hybrid Architecture
# Services:
#   1. media-service  — Express upload API (port 4000)
#   2. blockchain-node — Local Hardhat node for dev (port 8545)
# ────────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. Media Upload Service ────────────────────────────────────────────────
  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    container_name: unitex-media
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-adminsdk
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}
      - BLOCKCHAIN_PRIVATE_KEY=${BLOCKCHAIN_PRIVATE_KEY}
      - BLOCKCHAIN_CONTRACT_ADDRESS=${BLOCKCHAIN_CONTRACT_ADDRESS}
    volumes:
      # Persistent media storage — survives container restarts
      - unitex-media-vol:/app/uploads
    secrets:
      - firebase-adminsdk
    networks:
      - unitex-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 2. Local Blockchain Node (dev only) ───────────────────────────────────
  blockchain-node:
    image: node:20-alpine
    container_name: unitex-blockchain-dev
    working_dir: /app
    command: sh -c "npm install && npx hardhat node"
    volumes:
      - ./blockchain:/app
    ports:
      - "8545:8545"
    networks:
      - unitex-net
    profiles:
      # Only start this service with: docker compose --profile dev up
      - dev

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  unitex-media-vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MEDIA_STORAGE_PATH:-./media-storage}

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  unitex-net:
    driver: bridge

# ── Secrets ───────────────────────────────────────────────────────────────────
secrets:
  firebase-adminsdk:
    file: ${FIREBASE_SERVICE_ACCOUNT_PATH:-./service-account.json}
